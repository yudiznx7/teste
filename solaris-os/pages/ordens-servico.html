<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ordens de Serviço — PowerGrid Solar OS</title>
<link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet">
</head>
<body data-page="ordens">

<div id="page-body" hidden>

  <ul class="nav nav-tabs-solaris mb-3">
    <li class="nav-item"><a class="nav-link active" href="#" data-status="">Todas</a></li>
    <li class="nav-item"><a class="nav-link" href="#" data-status="Pendente">Pendentes</a></li>
    <li class="nav-item"><a class="nav-link" href="#" data-status="Em andamento">Em andamento</a></li>
    <li class="nav-item"><a class="nav-link" href="#" data-status="Concluída">Concluídas</a></li>
    <li class="nav-item"><a class="nav-link" href="#" data-status="Atrasada">Atrasadas</a></li>
  </ul>

  <div class="filter-bar">
    <div class="topbar-search" style="max-width:280px">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="busca-os" placeholder="Buscar por nº, cliente, técnico...">
    </div>
    <div class="ms-auto text-muted small" id="contador-os"></div>
  </div>

  <div class="row g-3" id="grid-os"></div>
  <nav class="mt-3"><ul class="pagination pagination-solaris justify-content-center mb-0" id="paginacao-os"></ul></nav>
</div>

<!-- MODAL CADASTRO / EDIÇÃO OS -->
<div class="modal fade" id="modal-os" tabindex="-1">
  <div class="modal-dialog modal-xl modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header border-0">
        <h5 class="modal-title" id="modal-os-title">Nova Ordem de Serviço</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="form-os">
        <div class="modal-body">
          <input type="hidden" id="os-id">
          <div class="row g-3">
            <div class="col-md-3"><label class="form-label">Nº da OS</label><input class="form-control" id="os-numero" disabled placeholder="Automático"></div>
            <div class="col-md-5">
              <label class="form-label">Cliente</label>
              <select class="form-select" id="os-cliente" required></select>
            </div>
            <div class="col-md-4"><label class="form-label">Data</label><input type="date" class="form-control" id="os-data" required></div>

            <div class="col-12"><label class="form-label">Endereço</label><input class="form-control" id="os-endereco"></div>

            <div class="col-md-5">
              <label for="os-cliente" class="form-label">Cliente</label>
              <select class="form-select" id="os-cliente" required></select>
            </div>
            <div class="col-md-4"><label class="form-label">Responsável Geral</label><input class="form-control" id="os-resp-geral" value="Admin Solaris"></div>
            <div class="col-md-4">
              <label for="os-equipe" class="form-label">Equipe</label>
              <select class="form-select" id="os-equipe"></select>
            </div>

            <div class="col-md-4">
              <label for="os-status" class="form-label">Status</label>
              <select class="form-select" id="os-status" aria-labelledby="os-status-label">
                <option>Pendente</option><option>Em andamento</option><option>Concluída</option><option>Atrasada</option>
              </select>
            </div>

            <div class="col-12">
              <label class="form-label d-flex align-items-center justify-content-between">
                <span>Checklist</span>
                <button type="button" class="btn btn-sm btn-light" id="btn-add-checklist"><i class="fa-solid fa-plus me-1"></i>Item</button>
              </label>
              <div id="checklist-container"></div>
            </div>

            <div class="col-12">
              <label class="form-label d-flex align-items-center justify-content-between">
                <span>Materiais utilizados</span>
                <button type="button" class="btn btn-sm btn-light" id="btn-add-material"><i class="fa-solid fa-plus me-1"></i>Material</button>
              </label>
              <div id="materiais-container"></div>
            </div>

            <div class="col-12"><label class="form-label">Observações</label><textarea class="form-control" id="os-obs" rows="2"></textarea></div>
              <div class="col-12">
                <label class="form-label" for="os-obs">Observações</label>
                <textarea class="form-control" id="os-obs" rows="2" placeholder="Digite observações sobre a ordem de serviço" title="Observações"></textarea>
              </div>
            <div class="col-12">
              <label class="form-label"><i class="fa-solid fa-camera me-1"></i> Fotos (URLs, uma por linha)</label>
              <textarea class="form-control" id="os-fotos" rows="2" placeholder="https://..."></textarea>
            </div>
          </div>
        </div>
        <div class="modal-footer border-0">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-solaris px-4">Salvar OS</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/app-shell.js"></script>
<script src="../js/ordens.js"></script>
</body>
</html>
