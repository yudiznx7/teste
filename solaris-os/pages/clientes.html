<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clientes — Solaris OS</title>
<link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet">
</head>
<body data-page="clientes">

<div id="page-body" hidden>

  <div class="filter-bar">
    <div class="topbar-search" style="max-width:280px">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="busca-cliente" placeholder="Buscar por nome, cidade, documento...">
    </div>
    <select class="form-select" id="filtro-status" style="max-width:180px">
      <option value="">Todos os status</option>
      <option value="Ativo">Ativo</option>
      <option value="Em instalação">Em instalação</option>
      <option value="Concluído">Concluído</option>
      <option value="Inativo">Inativo</option>
    </select>
    <div class="ms-auto text-muted small" id="contador-clientes"></div>
  </div>

  <div class="card-solaris p-3">
    <div class="table-responsive">
      <table class="table table-solaris mb-0">
        <thead><tr>
          <th>Cliente</th><th>Cidade</th><th>Sistema</th><th>Módulos</th><th>Status</th><th class="text-end">Ações</th>
        </tr></thead>
        <tbody id="tbody-clientes"></tbody>
      </table>
    </div>
  </div>
  <nav class="mt-3"><ul class="pagination pagination-solaris justify-content-center mb-0" id="paginacao-clientes"></ul></nav>
</div>

<!-- MODAL CADASTRO / EDIÇÃO -->
<div class="modal fade" id="modal-cliente" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header border-0">
        <h5 class="modal-title" id="modal-cliente-title">Novo Cliente</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="form-cliente">
        <div class="modal-body">
          <input type="hidden" id="c-id">
          <div class="row g-3">
            <div class="col-md-6"><label class="form-label">Nome</label><input class="form-control" id="c-nome" required></div>
            <div class="col-md-3"><label class="form-label">Telefone</label><input class="form-control" id="c-telefone" required></div>
            <div class="col-md-3"><label class="form-label">CPF/CNPJ</label><input class="form-control" id="c-documento" required></div>

            <div class="col-md-4"><label class="form-label">Cidade</label><input class="form-control" id="c-cidade" required></div>
            <div class="col-md-8"><label class="form-label">Endereço</label><input class="form-control" id="c-endereco" placeholder="Rua, número, bairro..."></div>

            <div class="col-md-4">
              <label class="form-label" for="c-loc-tipo">App de navegação preferido</label>
              <select class="form-select" id="c-loc-tipo">
                <option value="maps">Google Maps</option>
                <option value="waze">Waze</option>
              </select>
            </div>
            <div class="col-md-8">
              <label class="form-label">Link personalizado de localização <span class="text-muted fw-normal">(opcional)</span></label>
              <input class="form-control" id="c-maps" placeholder="Cole aqui um link do Maps ou Waze — se vazio, geramos um a partir do endereço">
            </div>

            <div class="col-md-3"><label class="form-label">Potência do Sistema</label><input class="form-control" id="c-potencia" placeholder="Ex: 6.5 kWp"></div>
            <div class="col-md-3"><label class="form-label">Qtd. Módulos</label><input type="number" class="form-control" id="c-qtdmodulos" min="0"></div>
            <div class="col-md-3"><label class="form-label">Modelo dos Módulos</label><input class="form-control" id="c-modmodulo"></div>
            <div class="col-md-3"><label class="form-label">Modelo do Inversor</label><input class="form-control" id="c-modinversor"></div>

            <div class="col-md-3"><label class="form-label">Qtd. de Strings</label><input type="number" class="form-control" id="c-strings" min="0"></div>
            <div class="col-md-4">
              <label class="form-label" for="c-status">Status</label>
              <select class="form-select" id="c-status">
                <option>Ativo</option><option>Em instalação</option><option>Concluído</option><option>Inativo</option>
              </select>
            </div>
            <div class="col-12"><label class="form-label">Observações</label><textarea class="form-control" id="c-obs" rows="2"></textarea></div>
          </div>
        </div>
        <div class="modal-footer border-0">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-solaris px-4">Salvar cliente</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/app-shell.js"></script>
<script src="../js/clientes.js"></script>
</body>
</html>
