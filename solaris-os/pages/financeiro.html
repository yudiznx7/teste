<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Financeiro — Solaris OS</title>
<link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet">
</head>
<body data-page="financeiro">

<div id="page-body" hidden>
  <div class="row g-3 mb-3" id="kpi-financeiro"></div>

  <div class="row g-3 mb-4">
    <div class="col-lg-7">
      <div class="chart-card h-100">
        <h6>Despesas por categoria</h6>
        <div class="subtitle">Distribuição total das despesas cadastradas</div>
        <div class="chart-wrap"><canvas id="chart-financeiro-cat"></canvas></div>
      </div>
    </div>
    <div class="col-lg-5">
      <div class="chart-card h-100">
        <h6>Evolução dos gastos</h6>
        <div class="subtitle">Total de despesas por dia</div>
        <div class="chart-wrap"><canvas id="chart-financeiro-linha"></canvas></div>
      </div>
    </div>
  </div>

  <div class="filter-bar">
    <select class="form-select" id="filtro-categoria-desp" style="max-width:220px"><option value="">Todas categorias</option></select>
    <input type="date" class="form-control" id="filtro-data-desp" style="max-width:180px">
    <div class="ms-auto text-muted small" id="contador-despesas"></div>
  </div>

  <div class="card-solaris p-3">
    <div class="table-responsive">
      <table class="table table-solaris mb-0">
        <thead><tr><th>Descrição</th><th>Categoria</th><th>Valor</th><th>Data</th><th>Responsável</th><th class="text-end">Ações</th></tr></thead>
        <tbody id="tbody-despesas"></tbody>
      </table>
    </div>
  </div>
</div>

<div class="modal fade" id="modal-despesa" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header border-0"><h5 class="modal-title" id="modal-despesa-title">Nova Despesa</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
      <form id="form-despesa">
        <div class="modal-body">
          <input type="hidden" id="d-id">
          <div class="row g-3">
            <div class="col-12"><label class="form-label">Descrição</label><input class="form-control" id="d-descricao" required></div>
            <div class="col-6">
              <label class="form-label">Categoria</label>
              <select class="form-select" id="d-categoria">
                <option>Refeição</option><option>Combustível</option><option>Ferramentas</option><option>Compra de Material</option><option>Outros</option>
              </select>
            </div>
            <div class="col-6"><label class="form-label">Valor (R$)</label><input type="number" min="0" step="0.01" class="form-control" id="d-valor" required></div>
            <div class="col-6"><label class="form-label">Data</label><input type="date" class="form-control" id="d-data" required></div>
            <div class="col-6"><label class="form-label">Responsável</label><input class="form-control" id="d-responsavel"></div>
          </div>
        </div>
        <div class="modal-footer border-0">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-solaris px-4">Salvar despesa</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/app-shell.js"></script>
<script src="../js/financeiro.js"></script>
</body>
</html>
