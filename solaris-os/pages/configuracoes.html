<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Configurações — Solaris OS</title>
<link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet">
</head>
<body data-page="configuracoes">

<div id="page-body" hidden>

  <ul class="nav nav-tabs-solaris mb-3 flex-wrap">
    <li class="nav-item"><a class="nav-link active" href="#" data-collection="categorias">Categorias</a></li>
    <li class="nav-item"><a class="nav-link" href="#" data-collection="fornecedores">Fornecedores</a></li>
    <li class="nav-item"><a class="nav-link" href="#" data-collection="modelos_inversores">Modelos de Inversores</a></li>
    <li class="nav-item"><a class="nav-link" href="#" data-collection="modelos_modulos">Modelos de Módulos</a></li>
    <li class="nav-item"><a class="nav-link" href="#" data-collection="equipes_config">Equipes</a></li>
    <li class="nav-item"><a class="nav-link" href="#" data-collection="usuarios">Usuários</a></li>
  </ul>

  <div class="row g-3">
    <div class="col-md-5 col-lg-4">
      <div class="card-solaris p-3">
        <h6 class="mb-3" id="form-config-title">Nova categoria</h6>
        <form id="form-config-simples">
          <div class="mb-3"><label class="form-label">Nome</label><input class="form-control" id="config-nome" required></div>
          <button class="btn btn-solaris w-100" type="submit"><i class="fa-solid fa-plus me-2"></i>Adicionar</button>
        </form>

        <form id="form-config-usuario" class="d-none">
          <div class="mb-3"><label class="form-label">Nome completo</label><input class="form-control" id="cu-nome" required></div>
          <div class="mb-3"><label class="form-label">Usuário</label><input class="form-control" id="cu-usuario" required></div>
          <div class="mb-3"><label class="form-label">Senha</label><input type="password" class="form-control" id="cu-senha" required></div>
          <div class="mb-3"><label class="form-label">Cargo</label><input class="form-control" id="cu-cargo" placeholder="Ex: Técnico, ADM"></div>
          <button class="btn btn-solaris w-100" type="submit"><i class="fa-solid fa-plus me-2"></i>Adicionar usuário</button>
        </form>
      </div>
    </div>

    <div class="col-md-7 col-lg-8">
      <div class="card-solaris p-3">
        <div class="table-responsive">
          <table class="table table-solaris mb-0" id="tabela-config">
            <thead><tr><th>Nome</th><th class="text-end">Ações</th></tr></thead>
            <tbody id="tbody-config"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/app-shell.js"></script>
<script src="../js/configuracoes.js"></script>
</body>
</html>
