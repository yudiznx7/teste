<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relatórios — Solaris OS</title>
<link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet">
</head>
<body data-page="relatorios">

<div id="page-body" hidden>

  <div class="filter-bar no-print">
    <select class="form-select" id="relatorio-tipo" style="max-width:260px">
      <option value="instalacoes">Instalações por período</option>
      <option value="materiais">Materiais utilizados</option>
      <option value="compras">Produtos comprados</option>
      <option value="despesas">Despesas</option>
      <option value="tecnicos">Ranking de Técnicos</option>
      <option value="clientes">Clientes</option>
    </select>
    <input type="date" class="form-control" id="relatorio-de" style="max-width:170px">
    <input type="date" class="form-control" id="relatorio-ate" style="max-width:170px">
    <button class="btn btn-outline-secondary" id="btn-gerar-relatorio"><i class="fa-solid fa-arrows-rotate me-2"></i>Gerar</button>
    <div class="ms-auto d-flex gap-2">
      <button class="btn btn-light" id="btn-imprimir"><i class="fa-solid fa-print me-2"></i>Imprimir</button>
      <button class="btn btn-solaris" id="btn-exportar-pdf"><i class="fa-solid fa-file-pdf me-2"></i>Exportar PDF</button>
    </div>
  </div>

  <div class="card-solaris p-4" id="relatorio-area">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div>
        <h5 class="mb-0" id="relatorio-titulo">Instalações por período</h5>
        <div class="small text-muted" id="relatorio-subtitulo"></div>
      </div>
      <div class="logo-mark d-none d-print-flex" style="width:40px;height:40px;background:linear-gradient(135deg,var(--yellow-500),var(--blue-700));border-radius:10px;color:#fff;align-items:center;justify-content:center"><i class="fa-solid fa-solar-panel"></i></div>
    </div>
    <div id="relatorio-conteudo"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/app-shell.js"></script>
<script src="../js/relatorios.js"></script>
</body>
</html>
