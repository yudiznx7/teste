<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compras — Solaris OS</title>
<link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet">
</head>
<body data-page="compras">

<div id="page-body" hidden>
  <div id="alerta-estoque-baixo" class="mb-3"></div>

  <ul class="nav nav-tabs-solaris mb-3">
    <li class="nav-item"><a class="nav-link active" href="#" data-tab="lista">Lista para comprar</a></li>
    <li class="nav-item"><a class="nav-link" href="#" data-tab="historico">Histórico de compras</a></li>
  </ul>

  <div id="tab-lista">
    <div class="card-solaris p-3">
      <div class="table-responsive">
        <table class="table table-solaris mb-0">
          <thead><tr><th>Produto</th><th>Estoque atual</th><th>Mínimo</th><th>Sugestão de compra</th><th>Fornecedor</th><th>Valor estimado</th><th class="text-end">Ação</th></tr></thead>
          <tbody id="tbody-comprar"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="tab-historico" class="d-none">
    <div class="card-solaris p-3">
      <div class="table-responsive">
        <table class="table table-solaris mb-0">
          <thead><tr><th>Produto</th><th>Quantidade</th><th>Fornecedor</th><th>Valor</th><th>Data</th></tr></thead>
          <tbody id="tbody-historico-compras"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/app-shell.js"></script>
<script src="../js/compras.js"></script>
</body>
</html>
