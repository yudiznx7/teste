<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Equipe — Solaris OS</title>
<link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet">
</head>
<body data-page="equipe">

<div id="page-body" hidden>
  <div class="filter-bar">
    <div class="topbar-search" style="max-width:280px">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="busca-equipe" placeholder="Buscar por nome, cargo, equipe...">
    </div>
    <div class="ms-auto text-muted small" id="contador-equipe"></div>
  </div>
  <div class="row g-3" id="grid-equipe"></div>
</div>

<div class="modal fade" id="modal-membro" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header border-0"><h5 class="modal-title" id="modal-membro-title">Novo Membro</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
      <form id="form-membro">
        <div class="modal-body">
          <input type="hidden" id="eq-id">
          <div class="row g-3">
            <div class="col-12"><label class="form-label">Nome</label><input class="form-control" id="eq-nome" required></div>
            <div class="col-6"><label class="form-label">Telefone</label><input class="form-control" id="eq-telefone" required></div>
            <div class="col-6"><label class="form-label">Cargo</label><input class="form-control" id="eq-cargo" required></div>
            <div class="col-6">
              <label class="form-label">Equipe</label>
              <select class="form-select" id="eq-equipe"></select>
            </div>
            <div class="col-6"><label class="form-label">Foto (URL)</label><input class="form-control" id="eq-foto" placeholder="https://..."></div>
            <div class="col-6"><label class="form-label">Instalações realizadas</label><input type="number" min="0" class="form-control" id="eq-realizadas" value="0"></div>
            <div class="col-6"><label class="form-label">Instalações pendentes</label><input type="number" min="0" class="form-control" id="eq-pendentes" value="0"></div>
          </div>
        </div>
        <div class="modal-footer border-0">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-solaris px-4">Salvar</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/app-shell.js"></script>
<script src="../js/equipe.js"></script>
</body>
</html>
