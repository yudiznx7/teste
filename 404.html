<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página não encontrada — Solaris OS</title>
<link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<style>
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--blue-950); }
  .box { text-align: center; color: #fff; padding: 40px; }
  .box .code { font-family: var(--font-display); font-size: 5rem; font-weight: 800; color: var(--yellow-500); line-height: 1; }
  .box .sun-loader { margin: 0 auto 20px; }
</style>
</head>
<body>
  <div class="box">
    <div class="sun-loader" style="position:relative;width:64px;height:64px;">
      <div class="core" style="position:absolute;inset:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%, #FFE29A, #E8A400);"></div>
    </div>
    <div class="code">404</div>
    <h4 class="font-display" style="color:#fff">Esta página está fora da rede</h4>
    <p style="color:rgba(255,255,255,.7)">O endereço acessado não existe ou foi movido.</p>
    <a href="/" class="btn btn-solaris px-4 mt-2"><i class="fa-solid fa-house me-2"></i>Voltar ao início</a>
  </div>
</body>
</html>
